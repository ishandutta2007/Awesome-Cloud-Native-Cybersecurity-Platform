<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#07152b"/><stop offset="100%" stop-color="#050a14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyberGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(-20px,15px);opacity:.65}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.2) translate(25px,-20px);opacity:.6}}@keyframes radarScan{0%{transform:rotate(0deg)}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes badgeFloat{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb2 10s ease-in-out infinite;transform-origin:1000px 320px}.radar{transform-origin:1060px 140px;animation:radarScan 12s linear infinite}.data-flow{stroke-dasharray:20,10;animation:flowLine 15s linear infinite}.pill-float-1{animation:badgeFloat 4s ease-in-out infinite}.pill-float-2{animation:badgeFloat 5s ease-in-out infinite 1s}.pill-float-3{animation:badgeFloat 4.5s ease-in-out infinite 2s}.pill-float-4{animation:badgeFloat 5.2s ease-in-out infinite 1.5s}.pill-float-5{animation:badgeFloat 4.8s ease-in-out infinite .5s}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g filter="url(#glow)"><circle cx="180" cy="90" r="140" fill="#38bdf8" class="orb-1"/><circle cx="1020" cy="330" r="160" fill="#818cf8" class="orb-2"/><circle cx="600" cy="210" r="180" fill="#c084fc" opacity=".12"/></g><g opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 0 100 Q 300 180 600 80 T 1200 120" class="data-flow"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 0 320 Q 400 240 800 340 T 1200 280" class="data-flow"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 150 420 L 350 260 L 550 350 L 750 200 L 950 280" class="data-flow"/></g><g opacity=".4" transform="translate(40, -20)"><circle cx="1020" cy="160" r="80" fill="none" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1"/><circle cx="1020" cy="160" r="50" fill="none" stroke="#818cf8" stroke-width="1"/><line x1="1020" x2="1090" y1="160" y2="160" stroke="#00f2fe" stroke-width="2" class="radar" filter="url(#softGlow)"/></g><rect width="1100" height="330" x="50" y="45" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" rx="14"/><g transform="translate(90, 80)"><rect width="64" height="64" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" rx="14"/><path fill="none" stroke="url(#cyberGrad)" stroke-linejoin="round" stroke-width="2.5" d="M 32 16 L 46 22 V 34 C 46 43 39 50 32 54 C 25 50 18 43 18 34 V 22 Z"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 27 34 L 30 38 L 38 29"/></g><g><text fill="url(#primaryGrad)" class="title-text" transform="translate(175, 115)">Awesome Cloud-Native Cybersecurity</text></g><g><text class="subtitle-text" transform="translate(175, 150)">Curated Guide to Enterprise Platforms &amp; Composable Open-Source SecOps</text></g><g><text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" transform="translate(90, 200)">CNAPP • XDR • SIEM • eBPF RUNTIME DETECTION • CSPM • VULNERABILITY SCANNING • THREAT HUNTING</text></g><g><g class="pill-float-1" transform="translate(90, 260) translate(0, 0)"><rect width="180" height="42" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" rx="21"/><circle cx="22" cy="21" r="5" fill="#38bdf8"/><text x="36" y="26" class="badge-text">🛡️ CNAPP Platforms</text></g><g class="pill-float-2" transform="translate(90, 260) translate(200, 0)"><rect width="190" height="42" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" rx="21"/><circle cx="22" cy="21" r="5" fill="#818cf8"/><text x="36" y="26" class="badge-text">⚡ Unified XDR / SIEM</text></g><g class="pill-float-3" transform="translate(90, 260) translate(410, 0)"><rect width="210" height="42" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" rx="21"/><circle cx="22" cy="21" r="5" fill="#c084fc"/><text x="36" y="26" class="badge-text">🔍 eBPF Runtime Security</text></g><g class="pill-float-4" transform="translate(90, 260) translate(640, 0)"><rect width="190" height="42" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1.2" rx="21"/><circle cx="22" cy="21" r="5" fill="#2dd4bf"/><text x="36" y="26" class="badge-text">☁️ Multi-Cloud CSPM</text></g><g class="pill-float-5" transform="translate(90, 260) translate(850, 0)"><rect width="170" height="42" fill="rgba(251, 146, 60, 0.12)" stroke="rgba(251, 146, 60, 0.4)" stroke-width="1.2" rx="21"/><circle cx="22" cy="21" r="5" fill="#fb923c"/><text x="36" y="26" class="badge-text">🚀 Shift-Left &amp; SBOM</text></g></g></svg>