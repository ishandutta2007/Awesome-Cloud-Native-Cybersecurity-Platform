<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#07152b" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(25px, -20px); opacity: 0.6; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 320px; }
    .radar { transform-origin: 1060px 140px; animation: radarScan 12s linear infinite; }
    .data-flow { stroke-dasharray: 20, 10; animation: flowLine 15s linear infinite; }
    .pill-float-1 { animation: badgeFloat 4s ease-in-out infinite; }
    .pill-float-2 { animation: badgeFloat 5s ease-in-out infinite 1s; }
    .pill-float-3 { animation: badgeFloat 4.5s ease-in-out infinite 2s; }
    .pill-float-4 { animation: badgeFloat 5.2s ease-in-out infinite 1.5s; }
    .pill-float-5 { animation: badgeFloat 4.8s ease-in-out infinite 0.5s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" />
    <circle class="orb-2" cx="1020" cy="330" r="160" fill="#818cf8" />
    <circle cx="600" cy="210" r="180" fill="#c084fc" opacity="0.12" />
  </g>

  <!-- Dynamic Circuit / Network Flow Lines in Background -->
  <g opacity="0.25">
    <path class="data-flow" d="M 0 100 Q 300 180 600 80 T 1200 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-flow" d="M 0 320 Q 400 240 800 340 T 1200 280" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="data-flow" d="M 150 420 L 350 260 L 550 350 L 750 200 L 950 280" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Decorative Cyber Shield Icon / Radar Graphic in Background Corner -->
  <g opacity="0.4" transform="translate(40, -20)">
    <circle cx="1020" cy="160" r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4, 4" />
    <circle cx="1020" cy="160" r="50" fill="none" stroke="#818cf8" stroke-width="1" />
    <line class="radar" x1="1020" y1="160" x2="1090" y2="160" stroke="#00f2fe" stroke-width="2" filter="url(#softGlow)" />
  </g>

  <!-- Foreground Main Card Container with Subtle Border -->
  <rect x="50" y="45" width="1100" height="330" rx="14" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Shield Icon Graphic in Card -->
  <g transform="translate(90, 80)">
    <rect width="64" height="64" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 32 16 L 46 22 V 34 C 46 43 39 50 32 54 C 25 50 18 43 18 34 V 22 Z" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 27 34 L 30 38 L 38 29" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND: Clear Title and Subtitles (Ensured Never Obscured) -->
  <g transform="translate(175, 115)">
    <text class="title-text" fill="url(#primaryGrad)">Awesome Cloud-Native Cybersecurity</text>
  </g>

  <g transform="translate(175, 150)">
    <text class="subtitle-text">Curated Guide to Enterprise Platforms &amp; Composable Open-Source SecOps</text>
  </g>

  <g transform="translate(90, 200)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14px" fill="#64748b" font-weight="500">
      CNAPP • XDR • SIEM • eBPF RUNTIME DETECTION • CSPM • VULNERABILITY SCANNING • THREAT HUNTING
    </text>
  </g>

  <!-- Interactive/Dynamic Domain Pills (Foreground Bottom) -->
  <g transform="translate(90, 260)">
    <!-- Pill 1: CNAPP -->
    <g class="pill-float-1" transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text class="badge-text" x="36" y="26">🛡️ CNAPP Platforms</text>
    </g>

    <!-- Pill 2: XDR & SIEM -->
    <g class="pill-float-2" transform="translate(200, 0)">
      <rect width="190" height="42" rx="21" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#818cf8" />
      <text class="badge-text" x="36" y="26">⚡ Unified XDR / SIEM</text>
    </g>

    <!-- Pill 3: eBPF Runtime -->
    <g class="pill-float-3" transform="translate(410, 0)">
      <rect width="210" height="42" rx="21" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#c084fc" />
      <text class="badge-text" x="36" y="26">🔍 eBPF Runtime Security</text>
    </g>

    <!-- Pill 4: CSPM & Audit -->
    <g class="pill-float-4" transform="translate(640, 0)">
      <rect width="190" height="42" rx="21" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#2dd4bf" />
      <text class="badge-text" x="36" y="26">☁️ Multi-Cloud CSPM</text>
    </g>

    <!-- Pill 5: Shift-Left -->
    <g class="pill-float-5" transform="translate(850, 0)">
      <rect width="170" height="42" rx="21" fill="rgba(251, 146, 60, 0.12)" stroke="rgba(251, 146, 60, 0.4)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#fb923c" />
      <text class="badge-text" x="36" y="26">🚀 Shift-Left &amp; SBOM</text>
    </g>
  </g>
</svg>